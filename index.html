<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shatranj</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1110; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #controls {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
    display: flex; gap: 6px; z-index: 10; flex-wrap: wrap;
  }
  button {
    background: #2a2a2a; color: #eee; border: 1px solid #444;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    transition: background 0.15s;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button:hover:not(:disabled) { background: #3a3a3a; }
  #status {
    position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 48px); left: 8px;
    background: rgba(0,0,0,0.65); padding: 6px 10px; border-radius: 8px;
    font-size: 13px; z-index: 10; max-width: 90vw; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; z-index: 30; background: #111; color: #eee;
    flex-direction: column; gap: 12px;
  }
  #loading .spinner {
    width: 32px; height: 32px;
    border: 3px solid #444; border-top-color: #eee;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Loading...</div></div>
<div id="controls">
  <button onclick="start(0)">Play as White</button>
  <button onclick="start(8)">Play as Black</button>
  <button id="undoBtn" onclick="undo()">Undo</button>
</div>
<div id="status"></div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { Shatranj } from "./src/shatranj.js";

const VAL = [0, 100, 320, 150, 600, 200, 20000];
const AI_DEPTH = 4;
const SQUARE = 1.0;
const BOARD_THICK = 0.15;
const PIECE_OBJ_URL = "./assets/pieces.obj";
const NAMES = ["p","n","b","r","q","k"];

let scene, camera, renderer, controls;
let pieceGeoms = {};
let pieceMeshes = [];
let squareObjs = [];
let highlightObjs = { sel: null, moves: [], last: [] };

let game = new Shatranj();
let playerColor = 0, aiColor = 8;
let selected = null, legal = [];
let aiThinking = false, gameOver = false, isAnimating = false;
let lastMove = null;

let raycaster, pointer;

const canvas    = document.getElementById("c");
const statusEl  = document.getElementById("status");
const undoBtn   = document.getElementById("undoBtn");
const loadingEl = document.getElementById("loading");

function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 9, -8);

  //const context = canvas.getContext("webgl");
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = false;//true;
  renderer.shadowMap
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.125;
  controls.maxDistance = 24;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(5, 12, 6);
  key.castShadow = true;
  key.shadow.mapSize.width = 1024;
  key.shadow.mapSize.height = 1024;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 30;
  key.shadow.camera.left = -8;
  key.shadow.camera.right = 8;
  key.shadow.camera.top = 8;
  key.shadow.camera.bottom = -8;
  key.shadow.bias = -0.0005;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x99aaff, 0.25);
  fill.position.set(-6, 8, -4);
  scene.add(fill);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  window.addEventListener("resize", onResize);
}

function positionCamera(color) {
  camera.position.set(0, 9, color === 0 ? -8 : 8);
  if (controls) {
    controls.target.set(0, 0, 0);
    controls.update();
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function squareToWorld(r, f) {
  return [(f - 3.5) * SQUARE, (3.5 - r) * SQUARE];
}

function squareToVec3(square, y = 0) {
  const r = square >> 4, f = square & 7;
  const [x, z] = squareToWorld(r, f);
  return new THREE.Vector3(x, y, z);
}

function buildBoard() {
  for (let r = 0; r < 8; r++) {
    squareObjs[r] = [];
    for (let f = 0; f < 8; f++) {
      const isLight = ((r + f) & 1) === 0;
      const geo = new THREE.PlaneGeometry(1,1,1);//new THREE.BoxGeometry(SQUARE * 0.98, BOARD_THICK, SQUARE * 0.98);
      const mat = new THREE.MeshStandardMaterial({
        color: isLight ? 0xf0d9b5 : 0xb58863,
        roughness: 0.0,
        metalness: 0.05
      });
      const sq = new THREE.Mesh(geo, mat);
      sq.rotation.x = -Math.PI/2;
      sq.receiveShadow = true;
      const [x, z] = squareToWorld(r, f);
      sq.position.set(x, 0, z);//-BOARD_THICK / 2
      sq.userData = { r, f, square: r * 16 + f };
      scene.add(sq);
      squareObjs[r][f] = sq;
    }
  }

  /*const baseGeo = new THREE.BoxGeometry(8.6, BOARD_THICK * 1.2, 8.6);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.85, metalness: 0.1 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = -BOARD_THICK - BOARD_THICK * 0.6;
  base.receiveShadow = true;
  scene.add(base);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.ShadowMaterial({ opacity: 0.3 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -BOARD_THICK * 2;
  ground.receiveShadow = true;
  scene.add(ground);*/
}

function loadPieces() {
  return new Promise((resolve, reject) => {
    const loader = new OBJLoader();
    loader.load(
      PIECE_OBJ_URL,
      (obj) => {
        obj.updateMatrixWorld(true);
        const geoMap = {};
        obj.traverse(child => {
          if (child.isMesh) {
            const name = (child.name || "").toLowerCase().trim();
            if (NAMES.includes(name)) {
              if (!geoMap[name]) geoMap[name] = [];
              const geo = child.geometry.clone();
              if (!geo.attributes.normal) geo.computeVertexNormals();
              //geo.applyMatrix4(child.matrixWorld);
              geoMap[name].push(geo);
            }
          }
        });
        for (const k of NAMES) {
          pieceGeoms[k] = geoMap[k][0];
        }
        for (const k in pieceGeoms) {
          const g = pieceGeoms[k];
          const scale = 0.75;
          g.scale(scale, scale, scale);
          g.computeBoundingBox();
          const bb = g.boundingBox;
          const cx = (bb.max.x + bb.min.x) / 2;
          const cz = (bb.max.z + bb.min.z) / 2;
          g.translate(-cx, -bb.min.y, -cz);
          g.computeBoundingBox();
        }
        resolve();
      },
      undefined,
      reject
    );
  });
}

function makePieceMesh(piece) {
  const type = piece & 7;
  const isBlack = (piece & 8) !== 0;
  const geo = pieceGeoms[NAMES[type-1]];
  if (!geo) return null;
  const mat = new THREE.MeshStandardMaterial({
    color: isBlack ? 0x664433 : 0x00ddaa,
    roughness: 0.2,
    side: THREE.DoubleSide,
    metalness: 0.1
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.rotation.y = (!isBlack)*Math.PI;
  return mesh;
}

function syncPieces() {
  for (const p of pieceMeshes) scene.remove(p.mesh);
  pieceMeshes = [];
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = r * 16 + f;
      const p = game.b[sq];
      if (p) {
        const mesh = makePieceMesh(p);
        if (mesh) {
          const v = squareToVec3(sq);
          mesh.position.set(v.x, 0, v.z);
          scene.add(mesh);
          pieceMeshes.push({ mesh, square: sq, piece: p });
        }
      }
    }
  }
}

function syncPiecePositions() {
  const meshAtSquare = new Map();
  for (const p of pieceMeshes) meshAtSquare.set(p.square, p);
  const desired = new Map();
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const sq = r * 16 + f;
    const p = game.b[sq];
    if (p) desired.set(sq, p);
  }
  for (const [sq, p] of meshAtSquare) {
    const want = desired.get(sq);
    if (!want || want !== p.piece) {
      scene.remove(p.mesh);
      pieceMeshes = pieceMeshes.filter(x => x !== p);
    }
  }
  for (const [sq, p] of desired) {
    const existing = meshAtSquare.get(sq);
    if (!existing || existing.piece !== p) {
      const mesh = makePieceMesh(p);
      if (mesh) {
        const v = squareToVec3(sq);
        mesh.position.set(v.x, 0, v.z);
        scene.add(mesh);
        pieceMeshes.push({ mesh, square: sq, piece: p });
      }
    }
  }
}

function clearHighlights() {
  for (const h of highlightObjs.moves) scene.remove(h);
  if (highlightObjs.sel) scene.remove(highlightObjs.sel);
  for (const h of highlightObjs.last) scene.remove(h);
  highlightObjs.moves = [];
  highlightObjs.sel = null;
  highlightObjs.last = [];
}

function highlightSquare(square, color, opacity = 0.5) {
  const geo = new THREE.PlaneGeometry(SQUARE * 0.95, SQUARE * 0.95);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false });
  const plane = new THREE.Mesh(geo, mat);
  plane.rotation.x = -Math.PI / 2;
  const v = squareToVec3(square);
  plane.position.set(v.x, 0.005, v.z);
  scene.add(plane);
  return plane;
}

function highlightMove(square) {
  const geo = new THREE.CircleGeometry(SQUARE * 0.16, 32);
  const mat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.55, depthWrite: false });
  const disc = new THREE.Mesh(geo, mat);
  disc.rotation.x = -Math.PI / 2;
  const v = squareToVec3(square);
  disc.position.set(v.x, 0.005, v.z);
  scene.add(disc);
  return disc;
}

function highlightCapture(square) {
  const geo = new THREE.RingGeometry(SQUARE * 0.32, SQUARE * 0.45, 32);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff3838, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = -Math.PI / 2;
  const v = squareToVec3(square);
  ring.position.set(v.x, 0.005, v.z);
  scene.add(ring);
  return ring;
}

function updateHighlights() {
  clearHighlights();
  if (lastMove) {
    highlightObjs.last.push(highlightSquare(lastMove[0], 0xffd200, 0.3));
    highlightObjs.last.push(highlightSquare(lastMove[1], 0xffd200, 0.3));
  }
  if (selected !== null) {
    highlightObjs.sel = highlightSquare(selected, 0x66ccff, 0.4);
  }
  for (const m of legal) {
    const target = m[1];
    const isCapture = game.b[target] !== 0;
    if (isCapture) highlightObjs.moves.push(highlightCapture(target));
    else highlightObjs.moves.push(highlightMove(target));
  }
}

let pointerDownPos = null;
let pointerMoved = false;

function onPointerDown(e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerMoved = false;
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
}

function onPointerMove(e) {
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (dx * dx + dy * dy > 36) pointerMoved = true;
}

function onPointerUp(e) {
  window.removeEventListener("pointermove", onPointerMove);
  window.removeEventListener("pointerup", onPointerUp);
  if (!pointerDownPos) return;
  const moved = pointerMoved;
  pointerDownPos = null;
  if (moved) return;
  if (aiThinking || gameOver || isAnimating) return;
  if (game.t !== playerColor) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const squares = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) squares.push(squareObjs[r][f]);
  const hits = raycaster.intersectObjects(squares);
  if (hits.length) {
    const sq = hits[0].object.userData.square;
    click(sq);
  }
}

function click(i) {
  if (aiThinking || gameOver || game.t !== playerColor || isAnimating) return;
  if (selected === i) { selected = null; legal = []; updateStatus(); updateHighlights(); return; }
  if (selected !== null) {
    const matches = legal.filter(m => m[1] === i);
    if (matches.length) {
      makeMove(matches[0]);
      return;
    }
    selected = null; legal = [];
  }
  if (game.b[i] && (game.b[i] & 8) === game.t) { selected = i; legal = game.moves(i); }
  updateStatus();
  updateHighlights();
}

function makeMove(m) {
  const from = m[0], to = m[1];
  game.apply(m);
  lastMove = [from, to];
  selected = null; legal = [];
  updateStatus();
  updateHighlights();
  isAnimating = true;
  animatePieceMove(from, to, () => {
    isAnimating = false;
    syncPiecePositions();
    afterMove();
  });
}

function animatePieceMove(from, to, onComplete) {
  const idx = pieceMeshes.findIndex(p => p.square === from);
  if (idx === -1) { syncPieces(); onComplete(); return; }
  const entry = pieceMeshes[idx];
  const capIdx = pieceMeshes.findIndex(p => p.square === to && p !== entry);
  if (capIdx !== -1) {
    const cap = pieceMeshes[capIdx];
    scene.remove(cap.mesh);
    pieceMeshes.splice(capIdx, 1);
  }
  entry.square = to;
  const startVec = entry.mesh.position.clone();
  const endVec   = squareToVec3(to);
  const liftHeight = 0.5;
  const distance = Math.hypot(endVec.x - startVec.x, endVec.z - startVec.z);
  const duration = Math.max(200, Math.min(450, distance * 90));
  const t0 = performance.now();
  function step() {
    const t = Math.min(1, (performance.now() - t0) / duration);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const x = startVec.x + (endVec.x - startVec.x) * ease;
    const z = startVec.z + (endVec.z - startVec.z) * ease;
    const y = Math.sin(t * Math.PI) * liftHeight;
    entry.mesh.position.set(x, y, z);
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      entry.mesh.position.set(endVec.x, 0, endVec.z);
      onComplete();
    }
  }
  step();
}

function afterMove() {
  const s = game.status();
  if (s === "checkmate" || s === "stalemateWin" || s === "bareWin" ||
      s === "drawBare" || s === "draw50" || s === "draw3fold") {
    gameOver = true;
    updateStatus();
    return;
  }
  if (game.t === aiColor) {
    aiThinking = true;
    updateStatus();
    const m = aiMove(AI_DEPTH);
    aiThinking = false;
    if (m) makeMove(m);
    else { gameOver = true; updateStatus(); }
  } else {
    updateStatus();
  }
}

function updateStatus() {
  const s = game.status();
  let txt = "";
  const winnerName = game.t ? "White" : "Black";
  if (s === "checkmate")         txt = `Checkmate - ${winnerName} wins!`;
  else if (s === "stalemateWin") txt = `Stalemate - ${winnerName} wins!`;
  else if (s === "bareWin")      txt = `Bare king - ${winnerName} wins!`;
  else if (s === "drawBare")     txt = "Draw - both kings bare";
  else if (s === "draw50")       txt = "Draw - 50-move rule";
  else if (s === "draw3fold")    txt = "Draw - threefold repetition";
  else {
    txt = `${game.t ? "Black" : "White"} to move`;
    if (s === "check") txt += " - CHECK!";
    if (aiThinking) txt += " (AI thinking...)";
    else if (game.t === playerColor) txt += " - your move";
  }
  gameOver ||= s === "checkmate" || s === "stalemateWin" || s === "bareWin" ||
               s === "drawBare" || s === "draw50" || s === "draw3fold";
  statusEl.textContent = txt;
  undoBtn.disabled = aiThinking || isAnimating || !game.hist.some(u => (u.p & 8) === playerColor);
}

function undo() {
  if (aiThinking || isAnimating) return;
  let n = 0;
  while (game.hist.length && n < 3) {
    game.undo();
    n++;
    if (game.t === playerColor) break;
  }
  lastMove = game.hist.length
    ? [game.hist[game.hist.length - 1].from, game.hist[game.hist.length - 1].to]
    : null;
  gameOver = false;
  selected = null; legal = [];
  syncPieces();
  updateStatus();
  updateHighlights();
}

function start(color) {
  playerColor = color;
  aiColor = color ^ 8;
  game = new Shatranj();
  syncPieces();
  positionCamera(color);
  selected = null; legal = [];
  gameOver = false; aiThinking = false; isAnimating = false; lastMove = null;
  updateStatus();
  updateHighlights();
  if (game.t === aiColor) {
    aiThinking = true;
    updateStatus();
    const m = aiMove(AI_DEPTH);
    aiThinking = false;
    if (m) makeMove(m);
    else { gameOver = true; updateStatus(); }
  }
}

function evaluate() {
  let s = 0;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const p = game.b[r * 16 + f];
    if (p) s += (p & 8) ? -VAL[p & 7] : VAL[p & 7];
  }
  return s;
}

function countNonKings() {
  let me = 0, opp = 0;
  const myColor = game.t, oppColor = myColor ^ 8;
  for (let r = 0; r < 8; r++)
    for (let f = 0; f < 8; f++) {
      const p = game.b[r * 16 + f];
      if (!p || (p & 7) === 6) continue;
      if ((p & 8) === myColor) me++;
      else opp++;
    }
  return [me, opp];
}

function negamax(depth, alpha, beta) {
  const me = game.t, opp = me ^ 8;
  const [myNon, oppNon] = countNonKings();
  if (myNon === 0) {
    if (oppNon === 0) return 0;
    if (oppNon >= 2) return -100000 + (10 - depth);
    const bare = game.bareKing();
    if (bare === "bareWin") return -100000 + (10 - depth);
    if (bare === "draw")    return 0;
  }
  if (game.h >= 100) return 0;
  if (depth === 0) return me === 0 ? evaluate() : -evaluate();
  const ms = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const i = r * 16 + f;
    if (game.b[i] && (game.b[i] & 8) === me)
      for (const m of game.pseudo(i)) ms.push(m);
  }
  ms.sort((a, b) =>
    (game.b[b[1]] ? VAL[game.b[b[1]] & 7] : 0) -
    (game.b[a[1]] ? VAL[game.b[a[1]] & 7] : 0));
  let best = -Infinity, hasLegal = false;
  for (const m of ms) {
    const u = game.apply(m, true);
    if (game.atk(game.king(me), opp)) { game.unapply(u, true); continue; }
    hasLegal = true;
    const score = -negamax(depth - 1, -beta, -alpha);
    game.unapply(u, true);
    if (score > best) best = score;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  if (!hasLegal) return -100000 + (10 - depth);
  return best;
}

function aiMove(depth) {
  const me = game.t, opp = me ^ 8;
  const ms = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const i = r * 16 + f;
    if (game.b[i] && (game.b[i] & 8) === me)
      for (const m of game.pseudo(i)) ms.push(m);
  }
  const scored = [];
  for (const m of ms) {
    const u = game.apply(m, true);
    if (game.atk(game.king(me), opp)) { game.unapply(u, true); continue; }
    const score = -negamax(depth - 1, -Infinity, Infinity);
    game.unapply(u, true);
    scored.push({ m, score });
  }
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const best = scored[0].score;
  const candidates = scored.filter(s => s.score >= best - 15);
  return candidates[Math.floor(Math.random() * candidates.length)].m;
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.undo = undo;
window.start = start;

(async () => {
  initThree();
  buildBoard();
  canvas.addEventListener("pointerdown", onPointerDown);
  try {
    await loadPieces();
  } catch (e) {
    console.error("Failed to load pieces", e);
    loadingEl.innerHTML = `<div>Failed to load pieces.</div><div style="font-size:12px;opacity:0.7">${e.message || e}</div>`;
    return;
  }
  loadingEl.style.display = "none";
  start(0);
  animate();
})();

</script>
</body>
</html>
